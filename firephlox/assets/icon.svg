<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2634" />
      <stop offset="100%" stop-color="#0a0f18" />
    </radialGradient>

    <!-- Metallic Gold Gradient for Borders -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecc94b" />
      <stop offset="50%" stop-color="#d69e2e" />
      <stop offset="100%" stop-color="#744210" />
    </linearGradient>

    <!-- Phlox Denobulan Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbd38d" />
      <stop offset="100%" stop-color="#ed8936" />
    </linearGradient>

    <!-- Starfleet Medical Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fd1c5" />
      <stop offset="100%" stop-color="#234e52" />
    </linearGradient>

    <!-- Paths for Text Alignment -->
    <!-- Top Text Path (Clockwise) -->
    <path id="topTextPath" d="M 70,250 A 180,180 0 0,1 430,250" fill="none" />
    <!-- Bottom Text Path (Clockwise - adjusted to keep text upright) -->
    <path id="bottomTextPath" d="M 430,250 A 180,180 0 0,1 70,250" fill="none" />
  </defs>

  <!-- Outer Emblem Circle -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#tealGrad)" stroke-width="3" stroke-dasharray="10 5" />

  <!-- Inner Graphic Framing -->
  <circle cx="250" cy="250" r="140" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- STYLIZED DR. PHLOX ICON -->
  <g id="phlox-character" transform="translate(0, 10)">
    <!-- Base Head Shape -->
    <path d="M 200,220 C 200,160 210,130 250,130 C 290,130 300,160 300,220 C 300,280 290,300 250,300 C 210,300 200,280 200,220 Z" 
          fill="url(#skinGrad)" />

    <!-- Denobulan Forehead and Facial Ridges (Minimalist Lines) -->
    <!-- Center Forehead Crest -->
    <path d="M 242,132 Q 250,150 258,132" fill="none" stroke="#744210" stroke-width="3" stroke-linecap="round" />
    <path d="M 238,145 Q 250,165 262,145" fill="none" stroke="#744210" stroke-width="3" stroke-linecap="round" />
    <path d="M 235,160 Q 250,180 265,160" fill="none" stroke="#744210" stroke-width="3" stroke-linecap="round" />

    <!-- Side Forehead Ridges -->
    <path d="M 215,150 Q 230,165 230,185" fill="none" stroke="#9c4221" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 285,150 Q 270,165 270,185" fill="none" stroke="#9c4221" stroke-width="2.5" stroke-linecap="round" />
    
    <path d="M 208,170 Q 225,185 225,205" fill="none" stroke="#9c4221" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 292,170 Q 275,185 275,205" fill="none" stroke="#9c4221" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cheek Ridges -->
    <path d="M 205,210 Q 220,220 222,240" fill="none" stroke="#9c4221" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 295,210 Q 280,220 278,240" fill="none" stroke="#9c4221" stroke-width="2.5" stroke-linecap="round" />

    <!-- Phlox's Iconic Wide, Warm Smile -->
    <path d="M 225,255 Q 250,285 275,255" fill="none" stroke="#4a1d1d" stroke-width="4" stroke-linecap="round" />
    <!-- Smile Crinkles -->
    <path d="M 222,257 Q 220,250 226,248" fill="none" stroke="#4a1d1d" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 278,257 Q 280,250 274,248" fill="none" stroke="#4a1d1d" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyes (Kind, crinkled arcs) -->
    <path d="M 223,205 Q 232,198 240,204" fill="none" stroke="#4a1d1d" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 277,205 Q 268,198 260,204" fill="none" stroke="#4a1d1d" stroke-width="3.5" stroke-linecap="round" />

    <!-- Starfleet Medical Uniform Collar (Enterprise NX-01 Era Blue/Teal) -->
    <path d="M 210,285 L 200,330 L 300,330 L 290,285 C 275,300 225,300 210,285 Z" fill="url(#tealGrad)" />
    <!-- Uniform Piping (Silver/Gold) -->
    <path d="M 210,285 C 225,300 275,300 290,285" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  </g>

  <!-- Starfleet Medical Insignia / Spark Elements -->
  <g transform="translate(250, 115) scale(0.6)">
    <path d="M 0,-20 L 5, -5 L 20,0 L 5,5 L 0,20 L -5,5 L -20,0 L -5,-5 Z" fill="url(#goldGrad)" />
  </g>

  <!-- TYPOGRAPHY / CAPTIONS -->
  <!-- Top Caption: HAVE NO FEAR -->
  <text font-family="'Arial Black', 'Impact', sans-serif" font-size="28" font-weight="900" fill="url(#goldGrad)" letter-spacing="4">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">HAVE NO FEAR,</textPath>
  </text>

  <!-- Bottom Caption: PHLOX IS HERE -->
  <text font-family="'Arial Black', 'Impact', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="4">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">PHLOX IS HERE!</textPath>
  </text>
</svg>